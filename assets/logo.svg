<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Gradient for the main shield/probe shape -->
    <linearGradient id="probeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4AA;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00B894;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#009B77;stop-opacity:1" />
    </linearGradient>

    <!-- Gradient for network waves -->
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4AA;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#00D4AA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4AA;stop-opacity:0.3" />
    </linearGradient>

    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00D4AA" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background circle (optional, for dark backgrounds) -->
  <circle cx="256" cy="256" r="240" fill="#1a1a2e" opacity="0"/>

  <!-- Network signal waves (emanating from probe) -->
  <g filter="url(#glow)" opacity="0.8">
    <!-- Outer wave -->
    <path d="M 380 170 Q 420 200, 420 256 Q 420 312, 380 342"
          fill="none" stroke="url(#waveGradient)" stroke-width="6" stroke-linecap="round"/>
    <!-- Middle wave -->
    <path d="M 350 195 Q 380 220, 380 256 Q 380 292, 350 317"
          fill="none" stroke="url(#waveGradient)" stroke-width="6" stroke-linecap="round"/>
    <!-- Inner wave -->
    <path d="M 320 220 Q 340 235, 340 256 Q 340 277, 320 292"
          fill="none" stroke="url(#waveGradient)" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Main probe body - stylized V shape pointing right (like a probe/arrow) -->
  <g filter="url(#shadow)">
    <!-- Probe arrow/V shape -->
    <path d="M 100 140
             L 280 256
             L 100 372
             L 100 310
             L 200 256
             L 100 202
             Z"
          fill="url(#probeGradient)"/>

    <!-- Accent line on the probe -->
    <path d="M 115 180 L 115 332"
          stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
  </g>

  <!-- Connection nodes/dots representing network endpoints -->
  <g fill="#00D4AA" filter="url(#glow)">
    <!-- Main connection point -->
    <circle cx="300" cy="256" r="12" fill="#ffffff"/>
    <circle cx="300" cy="256" r="8" fill="#00D4AA"/>

    <!-- Target nodes -->
    <circle cx="420" cy="160" r="8" fill="#00D4AA" opacity="0.8"/>
    <circle cx="440" cy="256" r="10" fill="#00D4AA"/>
    <circle cx="420" cy="352" r="8" fill="#00D4AA" opacity="0.8"/>
  </g>

  <!-- Connection lines from probe to targets -->
  <g stroke="#00D4AA" stroke-width="2" stroke-dasharray="4,4" opacity="0.5">
    <line x1="312" y1="252" x2="412" y2="164"/>
    <line x1="312" y1="256" x2="430" y2="256"/>
    <line x1="312" y1="260" x2="412" y2="348"/>
  </g>

  <!-- "VM" text integrated subtly -->
  <text x="130" y="270" font-family="Arial Black, sans-serif" font-size="48" font-weight="900" fill="#ffffff" opacity="0.15">VM</text>
</svg>
