---
# Inventory file for vmprober installation
# Modify this file with your hosts configuration
#
# Usage:
#   ansible-playbook -i inventory.yml install-vmprober.yml

all:
  children:
    # Group for all vmprober hosts
    vmprober:
      hosts:
        vmprober-host-1:
          ansible_host: 192.168.1.100
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/id_rsa
          # ansible_port: 22
          # ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
        vmprober-host-2:
          ansible_host: 192.168.1.101
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/id_rsa
          # ansible_port: 22
      vars:
        # Group-level variables (can be overridden per host)
        # vmprober_version: "v1.0.0"
        # vmprober_arch: "amd64"

  # Global variables for all hosts
  vars:
