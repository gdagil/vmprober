---
# Playbook for managing vmprober service
# This playbook only manages the service without installation or configuration

- name: Manage vmprober service
  hosts: vmprober
  become: true
  vars:
    vmprober_install: false
    vmprober_configure: false
    vmprober_manage_service: true
    vmprober_cleanup: false

  roles:
    - vmprober-config
