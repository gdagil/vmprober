---
# Group variables for vmprober installation
# Modify this file with your configuration values

# Version to install (tag name from GitHub releases)
# Examples: v0.1.0rc1, v1.0.0, v1.2.3
vmprober_version: "v0.1.0rc1"

# Architecture: amd64 or arm64 (auto-detected if not specified)
# Uncomment and set manually if you need to override auto-detection
# vmprober_arch: "amd64"

# Local download directory on control node
vmprober_local_download_dir: "/tmp/vmprober_downloads"

# Remote package directory on target hosts
vmprober_remote_package_dir: "/tmp/vmprober"

# VMProber configuration
# This will be rendered to /etc/vmprober/config.yaml by vmprober-config role
# The role automatically generates TCP and ICMP probes for all nodes from inventory
# Uncomment and customize as needed

# Probe intervals and timeouts for inventory nodes
vmprober_tcp_probe_port: 8429  # Port for TCP probes (vmprober service port)
vmprober_tcp_probe_interval: "10s"
vmprober_tcp_probe_timeout: "5s"
vmprober_icmp_probe_interval: "10s"
vmprober_icmp_probe_timeout: "2s"

# Full vmprober configuration
# The vmprober-config role will automatically add probes for all inventory nodes
# Additional static probes can be added in targets.static section
vmprober_config:
  listen:
    port: 8429
    host: "0.0.0.0"
    tls:
      enabled: false
  pull:
    enabled: true
    path: "/metrics"
    timeout: 10s
  push:
    enabled: true
    endpoints:
      - url: "http://localhost:8480/insert/0/prometheus/api/v1/import"
        headers: {}
        auth:
          type: "none"
    retry:
      max_attempts: 5
      backoff: "exponential"
      initial_delay: "1s"
      max_delay: "60s"
      multiplier: 2.0
    dedup:
      enabled: true
      window: "5m"
      keys: ["job", "instance", "probe", "target", "proto"]
    batch:
      size: 1000
      timeout: "30s"
    remote_write:
      enabled: false
  scheduler:
    concurrent: 100
    rps_limit: 1000
    per_host_cap: 10
    jitter: 0.1
    timeouts:
      tcp: "5s"
      udp: "3s"
      icmp: "2s"
      http: "10s"
      https: "10s"
      dns: "5s"
      grpc: "10s"
    queue_size: 10000
    worker_timeout: "30s"
  # Additional static probes (optional)
  # Probes for inventory nodes are automatically generated by the role
  targets:
    static: []
      # Example: Additional static probes can be added here
      # - host: "example.com"
      #   port: 80
      #   proto: "tcp"
      #   interval: "10s"
      #   timeout: "5s"
      #   labels:
      #     service: "example"
