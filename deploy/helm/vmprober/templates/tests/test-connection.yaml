apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "vmprober.fullname" . }}-test-connection"
  labels:
    {{- include "vmprober.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.37
      command: ["wget"]
      args:
        - "--spider"
        - "-S"
        - "http://{{ include "vmprober.fullname" . }}:{{ .Values.service.port }}/health"
