<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="probeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4AA"/>
      <stop offset="50%" style="stop-color:#00B894"/>
      <stop offset="100%" style="stop-color:#009B77"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4AA;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#00D4AA;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00D4AA;stop-opacity:0.3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer dark background -->
  <rect width="1280" height="640" fill="#0a0a0f"/>

  <!-- Border lines (40pt from edges) -->
  <line x1="40" y1="40" x2="40" y2="600" stroke="#00D4AA" stroke-width="1" opacity="0.2"/>
  <line x1="1240" y1="40" x2="1240" y2="600" stroke="#00D4AA" stroke-width="1" opacity="0.2"/>
  <line x1="40" y1="40" x2="1240" y2="40" stroke="#00D4AA" stroke-width="1" opacity="0.2"/>
  <line x1="40" y1="600" x2="1240" y2="600" stroke="#00D4AA" stroke-width="1" opacity="0.2"/>

  <!-- Inner dark content area -->
  <rect x="40" y="40" width="1200" height="560" fill="#12121a"/>

  <!-- Subtle grid pattern -->
  <g stroke="#00D4AA" stroke-width="0.5" opacity="0.05">
    <line x1="40" y1="160" x2="1240" y2="160"/>
    <line x1="40" y1="320" x2="1240" y2="320"/>
    <line x1="40" y1="480" x2="1240" y2="480"/>
    <line x1="320" y1="40" x2="320" y2="600"/>
    <line x1="640" y1="40" x2="640" y2="600"/>
    <line x1="960" y1="40" x2="960" y2="600"/>
  </g>

  <!-- Logo section - centered -->
  <g transform="translate(640, 200)" filter="url(#glow)">
    <!-- Probe arrow -->
    <path d="M -80 -50 L 0 0 L -80 50 L -80 30 L -40 0 L -80 -30 Z" fill="url(#probeGrad)" transform="scale(1.5)"/>

    <!-- Signal waves -->
    <g opacity="0.8">
      <path d="M 50 -35 Q 75 -20, 75 0 Q 75 20, 50 35" fill="none" stroke="url(#waveGrad)" stroke-width="6" stroke-linecap="round"/>
      <path d="M 70 -50 Q 105 -25, 105 0 Q 105 25, 70 50" fill="none" stroke="url(#waveGrad)" stroke-width="6" stroke-linecap="round"/>
      <path d="M 90 -65 Q 135 -35, 135 0 Q 135 35, 90 65" fill="none" stroke="url(#waveGrad)" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- Connection dot -->
    <circle cx="35" cy="0" r="12" fill="#ffffff"/>
    <circle cx="35" cy="0" r="6" fill="#00D4AA"/>

    <!-- Target nodes -->
    <circle cx="155" cy="-55" r="8" fill="#00D4AA" opacity="0.7"/>
    <circle cx="170" cy="0" r="10" fill="#00D4AA"/>
    <circle cx="155" cy="55" r="8" fill="#00D4AA" opacity="0.7"/>

    <!-- Connection lines -->
    <g stroke="#00D4AA" stroke-width="2" stroke-dasharray="6,4" opacity="0.5">
      <line x1="47" y1="-5" x2="147" y2="-52"/>
      <line x1="47" y1="0" x2="160" y2="0"/>
      <line x1="47" y1="5" x2="147" y2="52"/>
    </g>
  </g>

  <!-- VMProber title text -->
  <text x="640" y="380" font-family="'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#ffffff" text-anchor="middle">VMProber</text>

  <!-- Tagline -->
  <text x="640" y="450" font-family="'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#8892a0" text-anchor="middle">High-performance network probe monitoring</text>
  <text x="640" y="490" font-family="'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#8892a0" text-anchor="middle">for Prometheus &amp; VictoriaMetrics</text>

  <!-- Decorative corner dots -->
  <g fill="#00D4AA" opacity="0.15">
    <circle cx="60" cy="60" r="3"/>
    <circle cx="80" cy="60" r="3"/>
    <circle cx="60" cy="80" r="3"/>
    <circle cx="1220" cy="60" r="3"/>
    <circle cx="1200" cy="60" r="3"/>
    <circle cx="1220" cy="80" r="3"/>
    <circle cx="60" cy="580" r="3"/>
    <circle cx="80" cy="580" r="3"/>
    <circle cx="60" cy="560" r="3"/>
    <circle cx="1220" cy="580" r="3"/>
    <circle cx="1200" cy="580" r="3"/>
    <circle cx="1220" cy="560" r="3"/>
  </g>
</svg>
