<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="probeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4AA"/>
      <stop offset="50%" style="stop-color:#00B894"/>
      <stop offset="100%" style="stop-color:#009B77"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4AA;stop-opacity:0.2"/>
      <stop offset="50%" style="stop-color:#00D4AA;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#00D4AA;stop-opacity:0.2"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="200" fill="url(#bgGrad)"/>
  
  <!-- Decorative grid pattern -->
  <g stroke="#00D4AA" stroke-width="0.5" opacity="0.1">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
  </g>
  
  <!-- Logo section -->
  <g transform="translate(50, 50)">
    <!-- Signal waves -->
    <g filter="url(#glow)" opacity="0.7">
      <path d="M 95 35 Q 110 45, 110 50 Q 110 55, 95 65" fill="none" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round"/>
      <path d="M 105 28 Q 125 40, 125 50 Q 125 60, 105 72" fill="none" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round"/>
      <path d="M 115 20 Q 140 35, 140 50 Q 140 65, 115 80" fill="none" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round"/>
    </g>
    
    <!-- Probe arrow -->
    <path d="M 20 25 L 80 50 L 20 75 L 20 62 L 55 50 L 20 38 Z" fill="url(#probeGrad)"/>
    
    <!-- Connection dot -->
    <circle cx="88" cy="50" r="5" fill="#ffffff"/>
    <circle cx="88" cy="50" r="3" fill="#00D4AA"/>
    
    <!-- Target dots -->
    <circle cx="145" cy="25" r="4" fill="#00D4AA" opacity="0.6"/>
    <circle cx="155" cy="50" r="5" fill="#00D4AA"/>
    <circle cx="145" cy="75" r="4" fill="#00D4AA" opacity="0.6"/>
    
    <!-- Connection lines -->
    <g stroke="#00D4AA" stroke-width="1" stroke-dasharray="3,3" opacity="0.4">
      <line x1="93" y1="48" x2="141" y2="27"/>
      <line x1="93" y1="50" x2="150" y2="50"/>
      <line x1="93" y1="52" x2="141" y2="73"/>
    </g>
  </g>
  
  <!-- Text section -->
  <g transform="translate(250, 100)">
    <text x="0" y="10" font-family="'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="56" font-weight="700" fill="#00D4AA">VM</text>
    <text x="105" y="10" font-family="'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="56" font-weight="700" fill="#ffffff">Prober</text>
  </g>
  
  <!-- Tagline -->
  <text x="250" y="145" font-family="'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="18" font-weight="400" fill="#8892a0">
    Network Probe Monitoring for Prometheus &amp; VictoriaMetrics
  </text>
  
  <!-- Decorative dots pattern -->
  <g fill="#00D4AA" opacity="0.15">
    <circle cx="680" cy="160" r="2"/>
    <circle cx="700" cy="160" r="2"/>
    <circle cx="720" cy="160" r="2"/>
    <circle cx="740" cy="160" r="2"/>
    <circle cx="760" cy="160" r="2"/>
    <circle cx="680" cy="175" r="2"/>
    <circle cx="700" cy="175" r="2"/>
    <circle cx="720" cy="175" r="2"/>
    <circle cx="740" cy="175" r="2"/>
    <circle cx="760" cy="175" r="2"/>
  </g>
</svg>

