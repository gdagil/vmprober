<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="probeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4AA"/>
      <stop offset="50%" style="stop-color:#00B894"/>
      <stop offset="100%" style="stop-color:#009B77"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4AA;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#00D4AA;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00D4AA;stop-opacity:0.3"/>
    </linearGradient>
  </defs>

  <!-- Outer pink/rose background -->
  <rect width="1280" height="640" fill="#ffe4e6"/>

  <!-- Border lines (40pt from edges) -->
  <line x1="40" y1="40" x2="40" y2="600" stroke="#e11d48" stroke-width="1" opacity="0.3"/>
  <line x1="1240" y1="40" x2="1240" y2="600" stroke="#e11d48" stroke-width="1" opacity="0.3"/>
  <line x1="40" y1="40" x2="1240" y2="40" stroke="#e11d48" stroke-width="1" opacity="0.3"/>
  <line x1="40" y1="600" x2="1240" y2="600" stroke="#e11d48" stroke-width="1" opacity="0.3"/>

  <!-- Inner white/light content area -->
  <rect x="40" y="40" width="1200" height="560" fill="#fefefe"/>

  <!-- Logo section - centered -->
  <g transform="translate(640, 200)">
    <!-- Probe arrow -->
    <path d="M -80 -50 L 0 0 L -80 50 L -80 30 L -40 0 L -80 -30 Z" fill="url(#probeGrad)" transform="scale(1.5)"/>

    <!-- Signal waves -->
    <g opacity="0.8">
      <path d="M 50 -35 Q 75 -20, 75 0 Q 75 20, 50 35" fill="none" stroke="url(#waveGrad)" stroke-width="6" stroke-linecap="round"/>
      <path d="M 70 -50 Q 105 -25, 105 0 Q 105 25, 70 50" fill="none" stroke="url(#waveGrad)" stroke-width="6" stroke-linecap="round"/>
      <path d="M 90 -65 Q 135 -35, 135 0 Q 135 35, 90 65" fill="none" stroke="url(#waveGrad)" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- Connection dot -->
    <circle cx="35" cy="0" r="12" fill="#ffffff" stroke="#00D4AA" stroke-width="4"/>
    <circle cx="35" cy="0" r="6" fill="#00D4AA"/>

    <!-- Target nodes -->
    <circle cx="155" cy="-55" r="8" fill="#00D4AA" opacity="0.6"/>
    <circle cx="170" cy="0" r="10" fill="#00D4AA"/>
    <circle cx="155" cy="55" r="8" fill="#00D4AA" opacity="0.6"/>

    <!-- Connection lines -->
    <g stroke="#00D4AA" stroke-width="2" stroke-dasharray="6,4" opacity="0.4">
      <line x1="47" y1="-5" x2="147" y2="-52"/>
      <line x1="47" y1="0" x2="160" y2="0"/>
      <line x1="47" y1="5" x2="147" y2="52"/>
    </g>
  </g>

  <!-- VMProber title text -->
  <text x="640" y="380" font-family="'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#1a1a2e" text-anchor="middle">VMProber</text>

  <!-- Tagline -->
  <text x="640" y="450" font-family="'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#64748b" text-anchor="middle">High-performance network probe monitoring</text>
  <text x="640" y="490" font-family="'SF Pro Display', 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#64748b" text-anchor="middle">for Prometheus &amp; VictoriaMetrics</text>
</svg>
