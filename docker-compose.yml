services:
  vmstorage:
    image: victoriametrics/vmstorage:${VM_VERSION:-latest}
    container_name: vmstorage
    volumes:
      - ./data/vmstorage:/victoria-metrics-data
    command:
      - "--storageDataPath=/victoria-metrics-data"
      - "--httpListenAddr=:8482"
      - "--vminsertAddr=:8400"
      - "--vmselectAddr=:8401"
    ports:
      - "8482:8482"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8482/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  vminsert:
    image: victoriametrics/vminsert:${VM_VERSION:-latest}
    container_name: vminsert
    depends_on:
      - vmstorage
    command:
      - "--storageNode=vmstorage:8400"
      - "--httpListenAddr=:8480"
    ports:
      - "8480:8480"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8480/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  vmselect:
    image: victoriametrics/vmselect:${VM_VERSION:-latest}
    container_name: vmselect
    depends_on:
      - vmstorage
    command:
      - "--storageNode=vmstorage:8401"
      - "--httpListenAddr=:8481"
      # Make freshly-ingested samples queryable within ~1s (default is 30s), so
      # e2e tests can read back metrics right after pushing them.
      - "--search.latencyOffset=1s"
    ports:
      - "8481:8481"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8481/health"]
      interval: 10s
      timeout: 5s
      retries: 3


  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-latest}
    container_name: grafana
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./data/grafana:/var/lib/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_DATASOURCES_ALLOW_EDITING=true
      - GF_PROVISIONING_DATASOURCES_ENABLED=true
      - GF_DATASOURCES_DEFAULT_URL=http://vmselect:8481/select/0/prometheus
    restart: unless-stopped
