version: '3.8'

services:
  vmstorage:
    image: victoriametrics/vmstorage:latest
    container_name: vmstorage
    volumes:
      - ./data/vmstorage:/victoria-metrics-data
    command:
      - "--storageDataPath=/victoria-metrics-data"
      - "--httpListenAddr=:8482"
      - "--vminsertAddr=:8400"
      - "--vmselectAddr=:8401"
    ports:
      - "8482:8482"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8482/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  vminsert:
    image: victoriametrics/vminsert:latest
    container_name: vminsert
    depends_on:
      - vmstorage
    command:
      - "--storageNode=vmstorage:8400"
      - "--httpListenAddr=:8480"
    ports:
      - "8480:8480"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8480/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  vmselect:
    image: victoriametrics/vmselect:latest
    container_name: vmselect
    depends_on:
      - vmstorage
    command:
      - "--storageNode=vmstorage:8401"
      - "--httpListenAddr=:8481"
    ports:
      - "8481:8481"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8481/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # vmprober:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: vmprober
  #   depends_on:
  #     - vminsert
  #   volumes:
  #     - ./config.docker.yaml:/etc/vmprober/config.yaml:ro
  #     - ./data/vmprober/wal:/var/lib/vmprober/wal
  #   ports:
  #     - "8429:8429"
  #   restart: unless-stopped
  #   command:
  #     - "./vmprober"
  #     - "--config=/etc/vmprober/config.yaml"
  #   healthcheck:
  #     test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8429/health"]
  #     interval: 30s
  #     timeout: 5s
  #     retries: 3

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    depends_on:
      - vmselect
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SERVER_ROOT_URL=http://localhost:3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3