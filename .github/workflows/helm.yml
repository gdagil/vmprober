name: Deploy (Helm & Ansible)

on:
  push:
    branches: [main]
    paths:
      - 'deploy/helm/**'
      - 'deploy/ansible/**'
      - 'ct.yaml'
      - '.github/workflows/helm.yml'
  pull_request:
    branches: [main]
    paths:
      - 'deploy/helm/**'
      - 'deploy/ansible/**'
      - 'ct.yaml'
      - '.github/workflows/helm.yml'

jobs:
  helm:
    name: Helm lint & install-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.7.0

      - name: List changed charts
        id: list-changed
        run: |
          changed=$(ct list-changed --config ct.yaml)
          if [ -n "$changed" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint charts
        run: ct lint --config ct.yaml

      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@v1.12.0

      - name: Install charts (helm install + helm test)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct install --config ct.yaml

  ansible:
    name: Ansible lint & syntax-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ansible tooling
        run: pip install ansible ansible-lint

      - name: ansible-lint
        working-directory: deploy/ansible
        run: ansible-lint

      - name: Syntax-check playbooks
        working-directory: deploy/ansible
        run: |
          for pb in playbooks/*.yml; do
            echo "== syntax-check $pb =="
            ansible-playbook -i inventory.yml "$pb" --syntax-check
          done
