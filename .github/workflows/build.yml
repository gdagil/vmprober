name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Get dependencies
        run: |
          go mod download
          go mod tidy

      - name: Run tests
        run: go test -v ./...

      - name: Build application
        env:
          VERSION: ${{ github.ref == 'refs/heads/main' && github.sha || 'dev' }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp || github.run_started_at }}
          GIT_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p bin
          go build -ldflags "-X main.Version=${VERSION} -X main.BuildTime=${BUILD_TIME} -X main.GitCommit=${GIT_COMMIT}" -o bin/vmprober ./cmd/vmprober

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vmprober-binary
          path: bin/vmprober
          retention-days: 7


