name: Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Get dependencies
        run: |
          go mod download
          go mod tidy

      - name: Run tests
        run: go test -v ./...

  build-binary:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: darwin
            goarch: amd64
          - goos: windows
            goarch: arm64
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Get dependencies
        run: |
          go mod download
          go mod tidy

      - name: Build application
        env:
          VERSION: ${{ github.ref == 'refs/heads/main' && github.sha || github.ref_name || 'dev' }}
          BUILD_TIME: ${{ github.event.head_commit.timestamp || github.run_started_at }}
          GIT_COMMIT: ${{ github.sha }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p bin
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
          fi
          CGO_ENABLED=0 GOOS=${GOOS} GOARCH=${GOARCH} go build \
            -ldflags "-w -s -X main.Version=${VERSION} -X main.BuildTime=${BUILD_TIME} -X main.GitCommit=${GIT_COMMIT}" \
            -o bin/vmprober-${GOOS}-${GOARCH}${EXT} ./cmd/vmprober

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vmprober-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/vmprober-${{ matrix.goos }}-${{ matrix.goarch }}*
          retention-days: 7

  build-docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Alpine
        id: meta-alpine
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=-alpine
            type=ref,event=pr,suffix=-alpine
            type=semver,pattern={{version}},suffix=-alpine
            type=semver,pattern={{major}}.{{minor}},suffix=-alpine
            type=sha,prefix={{branch}}-,suffix=-alpine
            type=sha,format=short,prefix={{branch}}-,suffix=-alpine
            type=raw,value=latest-alpine,enable={{is_default_branch}}
            type=raw,value=main-alpine,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Extract metadata for Scratch
        id: meta-scratch
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=-scratch
            type=ref,event=pr,suffix=-scratch
            type=semver,pattern={{version}},suffix=-scratch
            type=semver,pattern={{major}}.{{minor}},suffix=-scratch
            type=sha,prefix={{branch}}-,suffix=-scratch
            type=sha,format=short,prefix={{branch}}-,suffix=-scratch
            type=raw,value=latest-scratch,enable={{is_default_branch}}
            type=raw,value=main-scratch,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Alpine image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-alpine.outputs.tags }}
          labels: ${{ steps.meta-alpine.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref == 'refs/heads/main' && github.sha || github.ref_name || 'dev' }}
            BUILD_TIME=${{ github.event.head_commit.timestamp || github.run_started_at }}
            GIT_COMMIT=${{ github.sha }}

      - name: Build and push Scratch image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.scratch
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-scratch.outputs.tags }}
          labels: ${{ steps.meta-scratch.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref == 'refs/heads/main' && github.sha || github.ref_name || 'dev' }}
            BUILD_TIME=${{ github.event.head_commit.timestamp || github.run_started_at }}
            GIT_COMMIT=${{ github.sha }}
