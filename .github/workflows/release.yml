name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GO_VERSION: '1.24'

jobs:
  release-binaries:
    name: Release Binaries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION_NUM=${VERSION#v}
          # Check if version is prerelease (rc, alpha, beta, dev, etc.)
          if [[ "$VERSION_NUM" =~ (rc|alpha|beta|dev|pre) ]]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_num=$VERSION_NUM" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "commit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "build_time=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
          fi
          go build \
            -trimpath \
            -ldflags "-w -s -X main.Version=${{ steps.version.outputs.version }} -X main.BuildTime=${{ steps.version.outputs.build_time }} -X main.GitCommit=${{ steps.version.outputs.commit }}" \
            -o dist/vmprober${EXT} \
            ./cmd/vmprober

      - name: Create archive (Unix)
        if: matrix.goos != 'windows'
        run: |
          cd dist
          ARCHIVE_NAME="vmprober-${{ steps.version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          tar -czvf ${ARCHIVE_NAME} vmprober
          sha256sum ${ARCHIVE_NAME} > ${ARCHIVE_NAME}.sha256
          echo "archive_name=${ARCHIVE_NAME}" >> $GITHUB_ENV

      - name: Create archive (Windows)
        if: matrix.goos == 'windows'
        run: |
          cd dist
          ARCHIVE_NAME="vmprober-${{ steps.version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}.zip"
          zip ${ARCHIVE_NAME} vmprober.exe
          sha256sum ${ARCHIVE_NAME} > ${ARCHIVE_NAME}.sha256
          echo "archive_name=${ARCHIVE_NAME}" >> $GITHUB_ENV

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vmprober-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/vmprober-*
          retention-days: 1

  release-deb:
    name: Build DEB Packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install nFPM
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION_NUM=${VERSION#v}
          # Check if version is prerelease (rc, alpha, beta, dev, etc.)
          if [[ "$VERSION_NUM" =~ (rc|alpha|beta|dev|pre) ]]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_num=$VERSION_NUM" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "commit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "build_time=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT

      - name: Build binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build \
            -trimpath \
            -ldflags "-w -s -X main.Version=${{ steps.version.outputs.version }} -X main.BuildTime=${{ steps.version.outputs.build_time }} -X main.GitCommit=${{ steps.version.outputs.commit }}" \
            -o dist/vmprober \
            ./cmd/vmprober

      - name: Create nFPM scripts
        run: |
          mkdir -p scripts
          cat > scripts/postinstall.sh << 'EOF'
          #!/bin/sh
          set -e
          if ! getent group vmprober >/dev/null 2>&1; then
            groupadd --system vmprober
          fi
          if ! getent passwd vmprober >/dev/null 2>&1; then
            useradd --system --gid vmprober --home-dir /var/lib/vmprober --shell /usr/sbin/nologin vmprober
          fi
          chown -R vmprober:vmprober /var/lib/vmprober /var/log/vmprober
          if command -v systemctl >/dev/null 2>&1; then
            systemctl daemon-reload
          fi
          echo ""
          echo "vmprober installed successfully!"
          echo ""
          echo "To get started:"
          echo "  1. Copy config: sudo cp /etc/vmprober/config.yaml.example /etc/vmprober/config.yaml"
          echo "  2. Edit config: sudo nano /etc/vmprober/config.yaml"
          echo "  3. Start service: sudo systemctl enable --now vmprober"
          echo ""
          EOF
          chmod +x scripts/postinstall.sh

          cat > scripts/preremove.sh << 'EOF'
          #!/bin/sh
          set -e
          if command -v systemctl >/dev/null 2>&1; then
            systemctl stop vmprober 2>/dev/null || true
            systemctl disable vmprober 2>/dev/null || true
          fi
          EOF
          chmod +x scripts/preremove.sh

          cat > scripts/postremove.sh << 'EOF'
          #!/bin/sh
          if command -v systemctl >/dev/null 2>&1; then
            systemctl daemon-reload
          fi
          EOF
          chmod +x scripts/postremove.sh

      - name: Create nFPM config
        run: |
          cat > nfpm.yaml << 'EOF'
          name: vmprober
          arch: ${{ matrix.goarch }}
          platform: linux
          version: ${{ steps.version.outputs.version_num }}
          maintainer: gdagil <gdagil@users.noreply.github.com>
          description: |
            VMProber - Multi-protocol endpoint prober with VictoriaMetrics integration.
            Supports HTTP, HTTPS, TCP, UDP, ICMP, DNS, and gRPC probing with
            comprehensive metrics collection and Prometheus-compatible output.
          vendor: gdagil
          homepage: https://github.com/gdagil/vmprober
          license: MIT
          section: utils
          priority: optional

          contents:
            - src: dist/vmprober
              dst: /usr/bin/vmprober
              file_info:
                mode: 0755

            - src: config/vmprober/config.yaml.example
              dst: /etc/vmprober/config.yaml.example
              type: config
              file_info:
                mode: 0644

            - src: config/vmprober/vmprober.service
              dst: /lib/systemd/system/vmprober.service
              file_info:
                mode: 0644

            - dst: /var/lib/vmprober
              type: dir
              file_info:
                mode: 0755

            - dst: /var/log/vmprober
              type: dir
              file_info:
                mode: 0755

          scripts:
            postinstall: scripts/postinstall.sh
            preremove: scripts/preremove.sh
            postremove: scripts/postremove.sh
          EOF

      - name: Build DEB package
        run: |
          nfpm package -p deb -f nfpm.yaml
          DEB_FILE=$(ls *.deb)
          TARGET_NAME="vmprober_${{ steps.version.outputs.version_num }}_${{ matrix.goarch }}.deb"
          if [ "$DEB_FILE" != "$TARGET_NAME" ]; then
            mv "$DEB_FILE" "$TARGET_NAME"
          fi
          sha256sum "$TARGET_NAME" > "${TARGET_NAME}.sha256"

      - name: Upload DEB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vmprober-deb-${{ matrix.goarch }}
          path: |
            *.deb
            *.deb.sha256
          retention-days: 1

  release-docker:
    name: Release Docker Images
    runs-on: ubuntu-latest
    outputs:
      alpine-digest: ${{ steps.build-alpine.outputs.digest }}
      scratch-digest: ${{ steps.build-scratch.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          VERSION_FULL=${GITHUB_REF#refs/tags/}
          # Check if version is prerelease (rc, alpha, beta, dev, etc.)
          if [[ "$VERSION" =~ (rc|alpha|beta|dev|pre) ]]; then
            IS_PRERELEASE="true"
            # Convert 0.1.0rc1 to 0.1.0-rc1 for semver compatibility
            VERSION_SEMVER=$(echo "$VERSION" | sed -E 's/([0-9])(rc|alpha|beta|dev|pre)/\1-\2/')
          else
            IS_PRERELEASE="false"
            VERSION_SEMVER="$VERSION"
          fi
          # Extract major and minor for semver tags (use base version without prerelease suffix)
          VERSION_BASE=$(echo "$VERSION_SEMVER" | cut -d- -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_full=$VERSION_FULL" >> $GITHUB_OUTPUT
          echo "version_semver=$VERSION_SEMVER" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "major=$(echo $VERSION_BASE | cut -d. -f1)" >> $GITHUB_OUTPUT
          echo "minor=$(echo $VERSION_BASE | cut -d. -f1-2)" >> $GITHUB_OUTPUT
          echo "commit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "build_time=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT

      - name: Extract metadata for Alpine
        id: meta-alpine
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-alpine
          tags: |
            type=semver,pattern={{version}},enable=${{ steps.version.outputs.is_prerelease == 'false' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.version.outputs.is_prerelease == 'false' }}
            type=semver,pattern={{major}},enable=${{ steps.version.outputs.is_prerelease == 'false' }}
            type=raw,value=${{ steps.version.outputs.version_full }}-alpine,enable=${{ steps.version.outputs.is_prerelease == 'true' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.is_prerelease == 'false' }}

      - name: Extract metadata for Scratch
        id: meta-scratch
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-scratch
          tags: |
            type=semver,pattern={{version}},enable=${{ steps.version.outputs.is_prerelease == 'false' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.version.outputs.is_prerelease == 'false' }}
            type=semver,pattern={{major}},enable=${{ steps.version.outputs.is_prerelease == 'false' }}
            type=raw,value=${{ steps.version.outputs.version_full }}-scratch,enable=${{ steps.version.outputs.is_prerelease == 'true' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.is_prerelease == 'false' }}

      - name: Build and push Alpine image
        id: build-alpine
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-alpine.outputs.tags }}
          labels: ${{ steps.meta-alpine.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_TIME=${{ steps.version.outputs.build_time }}
            GIT_COMMIT=${{ steps.version.outputs.commit }}

      - name: Build and push Scratch image
        id: build-scratch
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.scratch
          push: true
          tags: ${{ steps.meta-scratch.outputs.tags }}
          labels: ${{ steps.meta-scratch.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_TIME=${{ steps.version.outputs.build_time }}
            GIT_COMMIT=${{ steps.version.outputs.commit }}

      - name: Generate artifact attestation for Alpine
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-alpine.outputs.digest }}
          push-to-registry: true

      - name: Generate artifact attestation for Scratch
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-scratch.outputs.digest }}
          push-to-registry: true

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [release-binaries, release-deb, release-docker]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: vmprober-*
          merge-multiple: true

      - name: List artifacts
        run: |
          echo "Downloaded artifacts:"
          ls -la artifacts/

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION_NUM=${VERSION#v}
          # Check if version is prerelease (rc, alpha, beta, dev, etc.)
          if [[ "$VERSION_NUM" =~ (rc|alpha|beta|dev|pre) ]]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_num=$VERSION_NUM" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

      - name: Create release notes header
        run: |
          cat << 'EOF' > RELEASE_NOTES.md
          ## Installation

          ### Binary Downloads

          | OS | Architecture | Download |
          |---|---|---|
          | Linux | amd64 | [vmprober-${{ steps.version.outputs.version }}-linux-amd64.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/vmprober-${{ steps.version.outputs.version }}-linux-amd64.tar.gz) |
          | Linux | arm64 | [vmprober-${{ steps.version.outputs.version }}-linux-arm64.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/vmprober-${{ steps.version.outputs.version }}-linux-arm64.tar.gz) |
          | macOS | amd64 | [vmprober-${{ steps.version.outputs.version }}-darwin-amd64.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/vmprober-${{ steps.version.outputs.version }}-darwin-amd64.tar.gz) |
          | macOS | arm64 | [vmprober-${{ steps.version.outputs.version }}-darwin-arm64.tar.gz](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/vmprober-${{ steps.version.outputs.version }}-darwin-arm64.tar.gz) |
          | Windows | amd64 | [vmprober-${{ steps.version.outputs.version }}-windows-amd64.zip](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/vmprober-${{ steps.version.outputs.version }}-windows-amd64.zip) |

          ### DEB Packages (Debian/Ubuntu)

          | Architecture | Download |
          |---|---|
          | amd64 | [vmprober_${{ steps.version.outputs.version_num }}_amd64.deb](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/vmprober_${{ steps.version.outputs.version_num }}_amd64.deb) |
          | arm64 | [vmprober_${{ steps.version.outputs.version_num }}_arm64.deb](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/vmprober_${{ steps.version.outputs.version_num }}_arm64.deb) |

          ```bash
          # Install on Debian/Ubuntu
          sudo dpkg -i vmprober_${{ steps.version.outputs.version_num }}_amd64.deb

          # Or using apt
          sudo apt install ./vmprober_${{ steps.version.outputs.version_num }}_amd64.deb
          ```

          ### Docker Images

          ```bash
          # Alpine-based (with shell, useful for debugging)
          docker pull ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version_num }}-alpine

          # Scratch-based (minimal, ~10MB smaller)
          docker pull ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version_num }}-scratch
          ```

          ### Verify checksums

          All binaries and packages include SHA256 checksum files. Verify with:
          ```bash
          sha256sum -c vmprober-${{ steps.version.outputs.version }}-linux-amd64.tar.gz.sha256
          sha256sum -c vmprober_${{ steps.version.outputs.version_num }}_amd64.deb.sha256
          ```

          ---

          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: vmprober ${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          append_body: true
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  announce:
    name: Announce Release
    runs-on: ubuntu-latest
    needs: create-release
    if: ${{ !contains(github.ref, 'rc') && !contains(github.ref, 'alpha') && !contains(github.ref, 'beta') && !contains(github.ref, 'dev') && !contains(github.ref, 'pre') }}

    steps:
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create job summary
        run: |
          echo "# 🎉 Release ${{ steps.version.outputs.version }} Published!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Links" >> $GITHUB_STEP_SUMMARY
          echo "- [GitHub Release](https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.version }})" >> $GITHUB_STEP_SUMMARY
          echo "- [Docker Images](https://github.com/${{ github.repository }}/pkgs/container/vmprober)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Packages" >> $GITHUB_STEP_SUMMARY
          echo "- Binary archives (tar.gz, zip)" >> $GITHUB_STEP_SUMMARY
          echo "- DEB packages for Debian/Ubuntu" >> $GITHUB_STEP_SUMMARY
          echo "- Docker images (Alpine & Scratch)" >> $GITHUB_STEP_SUMMARY
