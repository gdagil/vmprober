# VMProber Configuration Example

# HTTP server
listen:
  port: 8429
  host: "0.0.0.0"
  tls:
    enabled: false

# Pull mode (Prometheus scrape)
pull:
  enabled: true
  path: "/metrics"
  timeout: 10s

# Push mode (VictoriaMetrics)
push:
  enabled: true
  interval: 30s  # collector export cadence
  endpoints:
    - url: "http://localhost:8480/insert/0/prometheus/api/v1/import"
      headers: {}
      auth:
        type: "none"
  retry:
    max_attempts: 5
    backoff: "exponential"
    initial_delay: 1s
    max_delay: 60s
    multiplier: 2.0
  dedup:
    enabled: true
    window: 5m
    keys: ["job", "instance", "probe", "target", "proto"]
  batch:
    size: 1000
    timeout: 30s
  remote_write:
    enabled: false

# Task scheduler
scheduler:
  concurrent: 100
  rps_limit: 1000
  per_host_cap: 10
  jitter: 0.1
  timeouts:
    tcp: 5s
    udp: 3s
    icmp: 2s
    http: 10s
    https: 10s
    dns: 5s
    grpc: 10s
  queue_size: 10000
  worker_timeout: 30s

# Target management
targets:
  static:
    # ===== TCP probes =====
    - host: "google.com"
      port: 80
      proto: "tcp"
      interval: 5s
      timeout: 5s
      labels:
        region: "us-east"
        type: "tcp"

    - host: "google.com"
      port: 443
      proto: "tcp"
      interval: 10s
      timeout: 5s
      labels:
        region: "us-east"
        type: "tcp-tls"

    # ===== UDP probes =====
    - host: "8.8.8.8"
      port: 53
      proto: "udp"
      interval: 20s
      timeout: 3s
      labels:
        service: "dns-udp"

    # ===== ICMP probes (ping) =====
    - host: "8.8.8.8"
      proto: "icmp"
      interval: 10s
      timeout: 2s
      labels:
        service: "google-dns"
        type: "icmp"

    # ===== HTTP probes =====
    - host: "httpbin.org"
      port: 80
      proto: "http"
      interval: 30s
      timeout: 10s
      labels:
        service: "httpbin"
        type: "http"
      http:
        method: "GET"
        path: "/status/200"
        expected_status_code: 200
        follow_redirects: true
        headers:
          Accept: "application/json"
          X-Custom-Header: "vmprober"

    # HTTP with POST request
    - host: "httpbin.org"
      port: 80
      proto: "http"
      interval: 60s
      timeout: 15s
      labels:
        service: "httpbin-post"
        type: "http-post"
      http:
        method: "POST"
        path: "/post"
        body: '{"test": "data"}'
        expected_status_code: 200
        headers:
          Content-Type: "application/json"

    # ===== HTTPS probes =====
    - host: "github.com"
      port: 443
      proto: "https"
      interval: 30s
      timeout: 10s
      labels:
        service: "github"
        type: "https"
      http:
        method: "GET"
        path: "/"
        expected_status_code: 200
        validate_cert: true
        follow_redirects: true

    # HTTPS with Basic Auth
    - host: "api.example.com"
      port: 443
      proto: "https"
      interval: 60s
      timeout: 15s
      labels:
        service: "api-auth"
        type: "https-auth"
      http:
        method: "GET"
        path: "/api/health"
        expected_status_code: 200
        validate_cert: true
        basic_auth:
          username: "admin"
          password: "secret"

    # HTTPS with Bearer Token
    - host: "api.example.com"
      port: 443
      proto: "https"
      interval: 60s
      timeout: 15s
      labels:
        service: "api-bearer"
        type: "https-bearer"
      http:
        method: "GET"
        path: "/api/protected"
        expected_status_code: 200
        bearer_token: "${API_TOKEN}"  # Environment variable

    # HTTPS via proxy
    - host: "internal-service.corp"
      port: 443
      proto: "https"
      interval: 30s
      timeout: 10s
      labels:
        service: "internal"
        type: "https-proxy"
      http:
        method: "GET"
        path: "/health"
        validate_cert: false  # For internal services with self-signed certs
        proxy: "http://proxy.corp:8080"

    # ===== DNS probes =====
    # Simple DNS A record check
    - host: "8.8.8.8"
      port: 53
      proto: "dns"
      interval: 30s
      timeout: 5s
      labels:
        service: "google-dns"
        type: "dns-a"
      dns:
        query_name: "google.com"
        query_type: "A"
        protocol: "udp"
        validate_answer: true
        recursion: true

    # DNS AAAA record check (IPv6)
    - host: "8.8.8.8"
      port: 53
      proto: "dns"
      interval: 60s
      timeout: 5s
      labels:
        service: "dns-ipv6"
        type: "dns-aaaa"
      dns:
        query_name: "google.com"
        query_type: "AAAA"
        protocol: "udp"

    # DNS MX record check
    - host: "8.8.8.8"
      port: 53
      proto: "dns"
      interval: 120s
      timeout: 5s
      labels:
        service: "dns-mx"
        type: "dns-mx"
      dns:
        query_name: "gmail.com"
        query_type: "MX"
        expected_records: ["gmail-smtp-in.l.google.com"]

    # DNS TXT record check (SPF, DKIM)
    - host: "1.1.1.1"
      port: 53
      proto: "dns"
      interval: 300s
      timeout: 5s
      labels:
        service: "cloudflare-dns"
        type: "dns-txt"
      dns:
        query_name: "example.com"
        query_type: "TXT"

    # DNS over TCP
    - host: "8.8.8.8"
      port: 53
      proto: "dns"
      interval: 60s
      timeout: 5s
      labels:
        type: "dns-tcp"
      dns:
        query_name: "google.com"
        query_type: "A"
        protocol: "tcp"

    # DNS-over-TLS (DoT)
    - host: "1.1.1.1"
      port: 853
      proto: "dns"
      interval: 60s
      timeout: 10s
      labels:
        service: "cloudflare-dot"
        type: "dns-dot"
      dns:
        query_name: "cloudflare.com"
        query_type: "A"
        protocol: "tcp-tls"

    # ===== gRPC probes =====
    # Simple gRPC health check
    - host: "grpc-service.local"
      port: 50051
      proto: "grpc"
      interval: 15s
      timeout: 5s
      labels:
        service: "grpc-backend"
        type: "grpc"
      grpc:
        service: ""  # Empty string = overall health check
        expected_status: "SERVING"

    # gRPC health check for specific service
    - host: "grpc-api.local"
      port: 50051
      proto: "grpc"
      interval: 30s
      timeout: 10s
      labels:
        service: "user-service"
        type: "grpc-service"
      grpc:
        service: "user.UserService"
        expected_status: "SERVING"

    # gRPC with TLS
    - host: "grpc-secure.example.com"
      port: 443
      proto: "grpc"
      interval: 30s
      timeout: 10s
      labels:
        service: "secure-grpc"
        type: "grpc-tls"
      grpc:
        service: "api.HealthService"
        tls: true
        tls_skip_verify: false
        server_name: "grpc-secure.example.com"
        expected_status: "SERVING"

    # gRPC with metadata (headers)
    - host: "grpc-auth.local"
      port: 50051
      proto: "grpc"
      interval: 30s
      timeout: 10s
      labels:
        service: "grpc-auth"
        type: "grpc-metadata"
      grpc:
        service: "auth.AuthService"
        expected_status: "SERVING"
        metadata:
          authorization: "Bearer ${GRPC_TOKEN}"
          x-request-id: "vmprober-health-check"

    # ===== Multiple protocols for single target =====
    - host: "multi-protocol.example.com"
      port: 443
      protocols: ["tcp", "https"]  # Check both TCP connection and HTTP
      interval: 30s
      timeout: 10s
      labels:
        service: "multi"
        type: "multi-protocol"
      http:
        method: "GET"
        path: "/health"
        expected_status_code: 200

  files: []
  urls: []
  commands: []
  reload_interval: 1m
  hot_reload: true

# Default probe settings
probes:
  defaults:
    count: 3
    interval: 30s
    timeout: 5s
    payload_size: 64

  # TCP probes
  tcp:
    connect_timeout: 5s
    tls:
      enabled: false
    keep_alive:
      enabled: true
      period: 30s

  # UDP probes
  udp:
    payload_type: "random"
    payload_size: 64
    response_timeout: 2s
    max_packet_size: 1024

  # ICMP probes (ping)
  icmp:
    library: "systicmp"
    sequence_start: 1
    ttl: 64

  # HTTP/HTTPS probes
  http:
    method: "GET"
    path: "/"
    expected_status_code: 200
    follow_redirects: true
    max_redirects: 10
    validate_cert: true
    timeout: 10s
    headers:
      User-Agent: "vmprober/1.0"

  # DNS probes
  dns:
    query_type: "A"         # A, AAAA, CNAME, MX, TXT, NS, SOA, SRV, PTR
    protocol: "udp"         # udp, tcp, tcp-tls (DoT)
    validate_answer: true
    recursion: true
    timeout: 5s

  # gRPC probes
  grpc:
    service: ""             # Empty string = overall check (grpc.health.v1.Health)
    tls: false
    tls_skip_verify: false
    expected_status: "SERVING"  # SERVING, NOT_SERVING, UNKNOWN
    timeout: 10s

# Metrics settings
metrics:
  namespace: "vmprober"
  include_labels:
    - "job"
    - "instance"
    - "probe"
    - "target"
    - "proto"
  custom_labels:
    job: "blackbox/vmprober"
    # prober: "dc1-a"  # identity of this instance; defaults to the hostname.
    #                  # Must be unique per instance, otherwise several vmprobers
    #                  # push into the same time series and rates become garbage.
  buckets: [0.001, 0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1.0, 2.5, 5.0, 10.0]
  enable_process_metrics: true
  enable_go_metrics: true
  enable_job_metrics: true

# Write-Ahead Log
wal:
  dir: "./data/vmprober/wal"
  max_size: "1GB"
  max_age: 168h
  retention: 720h
  compression: "gzip"
  sync_interval: 1s
  buffer_size: "64KB"
  segment_size: "64MB"
  index_cache_size: 1000

# Logging
logging:
  level: "debug"
  format: "text"
  output: "stdout"
  file:
    path: "/var/log/vmprober.log"
    max_size: "100MB"
    max_backups: 10
    max_age: 30
    compress: true
  structured: true
  include_source: true

# TLS settings
tls:
  client_certs:
    enabled: false
  server_certs:
    enabled: false
  insecure_skip_verify: false
  min_version: "1.2"
  max_version: "1.3"
  cipher_suites: []

# Observability
observability:
  pprof:
    enabled: false
    port: 6060
    host: "127.0.0.1"
  opencensus:
    enabled: false
    sampling_rate: 0.1
    exporters: []
  prometheus:
    enabled: false
    namespace: "vmprober"
    subsystem: "process"
  health_check:
    enabled: true
    timeout: 5s
    interval: 30s
